appId: 'github.com/vladimiry/ElectronMail'
artifactName: ${name}-${version}-${os}-${arch}.${ext}
productName: 'ElectronMail'
executableName: 'electron-mail'
publish: null
forceCodeSigning: false

nativeModules:
  # native dependencies compiling gets triggered in ./scripts/prepare-native-deps.ts
  npmRebuild: false

directories:
  output: ./dist
files:
  # TODO exclude not needed stuff in 'files:' section to reduce app packages size, can save megabytes, so a significant improvement
  - 'app/**/*'
  - 'package.json'
  - '!app/**/*/index-e2e.{js,cjs,mjs}'
  - '!node_modules/**/bin/**/*.node'
  - '!node_modules/**/*.bare'
  - '!node_modules/sodium-native/{build,extensions}'
  - '!node_modules/msgpackr-extract/bin/download-prebuilds.js'
compression: normal
asar:
  unpack:
    - 'node_modules/{keytar,msgpackr-extract,sodium-native}'

mac:
  icon: ./app/assets/icons/mac/icon.icns
  category: public.app-category.productivity
  darkModeSupport: true
  target:
    - { target: dmg }

dmg:
  icon: ./app/assets/icons/mac/icon.icns
  iconSize: 128
  contents:
    - { x: 380, y: 240, type: link, path: /Applications }
    - { x: 122, y: 240, type: file }

linux:
  icon: ./app/assets/icons/png
  category: Office
  packageCategory: Office
  desktop:
    entry:
      GenericName: Unofficial ProtonMail Desktop App
  executableArgs:
    - '--js-flags="--max-old-space-size=12288"'

snapcraft:
  base: core24
  core24:
    confinement: strict
    plugs:
      - browser-support
      - desktop
      - desktop-legacy
      - network
      - password-manager-service
    useLXD: true

win:
  artifactName: ${name}-${version}-windows-${arch}.${ext}
  icon: ./app/assets/icons/win/icon.ico
  target:
    - { target: nsis }

nsis:
  artifactName: ${name}-${version}-windows-${arch}-nsis-installer.${ext}
  oneClick: false
  perMachine: false
  include: scripts/electron-builder/installer.nsh
